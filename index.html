<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PegasIA Legal - Generador</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col">

    <!-- PANTALLA DE LOGIN -->
    <div id="pantalla-login" class="flex-1 flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm border-t-4 border-gray-800">
            <h2 class="text-2xl font-bold mb-6 text-center">Acceso PegasIA</h2>
            <form id="formulario-login" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Correo electrónico</label>
                    <input type="email" id="login_email" placeholder="ana@pegasia.es" class="w-full border p-2 rounded focus:ring-gray-800 focus:border-gray-800" required>
                </div>
                <button type="submit" id="btn-login" class="w-full bg-gray-800 text-white font-bold py-2 px-4 rounded hover:bg-black transition">
                    Entrar al Despacho
                </button>
            </form>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL (Oculta por defecto) -->
    <div id="pantalla-app" class="hidden max-w-3xl mx-auto w-full py-8">
        <div class="flex justify-between items-end mb-6">
            <div>
                <h1 class="text-2xl font-bold">Generador de Contratos</h1>
                <p id="nombre-despacho" class="text-blue-600 font-semibold"></p>
            </div>
            <button onclick="cerrarSesion()" class="text-sm text-red-600 hover:underline font-medium">Cerrar sesión</button>
        </div>

        <div class="bg-white p-8 rounded-lg shadow-md border-t-4 border-blue-600">
            <!-- SELECTOR DE DOCUMENTO -->
            <div class="mb-6 pb-6 border-b">
                <label class="block text-sm font-bold text-gray-700 mb-2">Selecciona la plantilla a generar:</label>
                <select id="tipo_documento" class="w-full border p-3 rounded-md bg-gray-50 focus:ring-blue-500 font-medium" onchange="cambiarFormulario()">
                    <option value="arrendamiento">Contrato de Arrendamiento</option>
                    <option value="nda">Acuerdo de Confidencialidad (NDA)</option>
                </select>
            </div>

            <form id="formulario-contrato" class="space-y-6">
                <!-- DATOS COMUNES -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Ciudad</label>
                        <input type="text" id="ciudad" value="Mairena del Alcor" class="w-full border p-2 rounded" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Fecha Larga</label>
                        <input type="text" id="fecha" value="15 de octubre de 2026" class="w-full border p-2 rounded" required>
                    </div>
                </div>

                <!-- BLOQUE 1: CAMPOS DE ARRENDAMIENTO -->
                <div id="bloque_arrendamiento" class="space-y-6">
                    <div class="bg-blue-50 p-4 rounded-md border border-blue-100">
                        <h3 class="font-semibold text-blue-800 mb-3">Datos del Arrendador</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm mb-1">Nombre completo</label>
                                <input type="text" id="arr_nombre" class="w-full border p-2 rounded">
                            </div>
                            <div>
                                <label class="block text-sm mb-1">DNI / NIF</label>
                                <input type="text" id="arr_dni" class="w-full border p-2 rounded">
                            </div>
                        </div>
                    </div>

                    <div class="border-t border-b py-4">
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" id="hay_fiador" class="form-checkbox h-5 w-5 text-blue-600" onchange="toggleFiador()">
                            <span class="font-medium">¿Incluir fiador solidario en el contrato?</span>
                        </label>
                        <div id="seccion_fiador" class="hidden mt-4 bg-gray-50 p-4 rounded-md border border-gray-200">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm mb-1">Nombre completo Fiador</label>
                                    <input type="text" id="fia_nombre" class="w-full border p-2 rounded">
                                </div>
                                <div>
                                    <label class="block text-sm mb-1">DNI / NIF Fiador</label>
                                    <input type="text" id="fia_dni" class="w-full border p-2 rounded">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-1">Anexos (separados por comas)</label>
                        <input type="text" id="anexos" class="w-full border p-2 rounded">
                    </div>
                </div>

                <!-- BLOQUE 2: CAMPOS DE NDA -->
                <div id="bloque_nda" class="space-y-6 hidden">
                    <div class="bg-purple-50 p-4 rounded-md border border-purple-100">
                        <h3 class="font-semibold text-purple-800 mb-3">Partes Involucradas</h3>
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm mb-1">Empresa Emisora</label>
                                <input type="text" id="nda_emisora" value="I.ATLAS" class="w-full border p-2 rounded">
                            </div>
                            <div>
                                <label class="block text-sm mb-1">Empresa Receptora</label>
                                <input type="text" id="nda_receptora" class="w-full border p-2 rounded">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm mb-1">Propósito del acuerdo</label>
                            <div class="flex gap-2">
                                <input type="text" id="nda_proposito" placeholder="Ej: Evaluar una posible fusión con Microsoft" class="w-full border p-2 rounded focus:ring-purple-500 focus:border-purple-500">
                                <button type="button" onclick="mejorarConIA(event)" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 transition flex-shrink-0 font-bold text-sm shadow-sm flex items-center gap-1">
                                    ✨ Mejorar con IA
                                </button>
                            </div>
                        </div>
                    </div> 
                </div> 

                <button type="submit" id="btn-generar" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-700 transition">
                    Generar Documento Word
                </button>
                <p id="mensaje-estado" class="text-sm text-center mt-2 text-green-600 font-semibold hidden">¡Documento generado con éxito!</p>
            </form>

            <!-- SECCIÓN DE HISTORIAL -->
            <div class="mt-12 border-t pt-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">Historial del Despacho</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-100 text-gray-600">
                            <tr>
                                <th class="p-3">ID</th>
                                <th class="p-3">Cliente / Entidad</th>
                                <th class="p-3">Tipo</th>
                                <th class="p-3">Fecha</th>
                                <th class="p-3 text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-historial" class="divide-y text-gray-700"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // VARIABLE GLOBAL PARA ALMACENAR EL USUARIO ACTIVO
        let usuarioActivo = null;

        // --- SISTEMA DE LOGIN ---
        document.getElementById('formulario-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.innerText = 'Entrando...';
            
            const email = document.getElementById('login_email').value;
            
            try {
                const respuesta = await fetch('http://127.0.0.1:8000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                if (!respuesta.ok) throw new Error('Error en login');
                
                usuarioActivo = await respuesta.json();
                
                document.getElementById('pantalla-login').classList.add('hidden');
                document.getElementById('pantalla-app').classList.remove('hidden');
                document.getElementById('nombre-despacho').innerText = usuarioActivo.despacho_nombre;
                
                cargarHistorial();
                
            } catch (error) {
                alert('No se pudo conectar con el servidor.');
            } finally {
                btn.innerText = 'Entrar al Despacho';
            }
        });

        function cerrarSesion() {
            usuarioActivo = null;
            document.getElementById('login_email').value = '';
            document.getElementById('pantalla-app').classList.add('hidden');
            document.getElementById('pantalla-login').classList.remove('hidden');
            document.getElementById('tabla-historial').innerHTML = '';
        }

        // --- LÓGICA DE FORMULARIOS ---
        function cambiarFormulario() {
            const tipo = document.getElementById('tipo_documento').value;
            document.getElementById('bloque_arrendamiento').classList.add('hidden');
            document.getElementById('bloque_nda').classList.add('hidden');
            
            if(tipo === 'arrendamiento') {
                document.getElementById('bloque_arrendamiento').classList.remove('hidden');
            } else if (tipo === 'nda') {
                document.getElementById('bloque_nda').classList.remove('hidden');
            }
        }

        function toggleFiador() {
            const seccion = document.getElementById('seccion_fiador');
            document.getElementById('hay_fiador').checked ? seccion.classList.remove('hidden') : seccion.classList.add('hidden');
        }

        // --- GENERAR CONTRATO ---
        document.getElementById('formulario-contrato').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-generar');
            btn.innerText = 'Generando...';
            btn.disabled = true;

            const tipo = document.getElementById('tipo_documento').value;
            let payload = {};
            let endpoint = '';
            let nombreArchivo = '';

            if (tipo === 'arrendamiento') {
                endpoint = '/api/generar/arrendamiento';
                nombreArchivo = `Contrato_${document.getElementById('arr_nombre').value.replace(' ', '_')}.docx`;
                const anexosString = document.getElementById('anexos').value;
                payload = {
                    ciudad: document.getElementById('ciudad').value,
                    fecha_larga: document.getElementById('fecha').value,
                    arrendador: {
                        nombre: document.getElementById('arr_nombre').value,
                        dni: document.getElementById('arr_dni').value
                    },
                    hay_fiador: document.getElementById('hay_fiador').checked,
                    fiador: document.getElementById('hay_fiador').checked ? {
                        nombre: document.getElementById('fia_nombre').value,
                        dni: document.getElementById('fia_dni').value
                    } : null,
                    anexos: anexosString ? anexosString.split(',').map(a => a.trim()) : []
                };
            } else if (tipo === 'nda') {
                endpoint = '/api/generar/confidencialidad';
                nombreArchivo = `NDA_${document.getElementById('nda_receptora').value.replace(' ', '_')}.docx`;
                payload = {
                    ciudad: document.getElementById('ciudad').value,
                    fecha_larga: document.getElementById('fecha').value,
                    empresa_emisora: document.getElementById('nda_emisora').value,
                    empresa_receptora: document.getElementById('nda_receptora').value,
                    proposito: document.getElementById('nda_proposito').value
                };
            }

            try {
                // AÑADIMOS EL HEADER usuario-id
                const respuesta = await fetch(`http://127.0.0.1:8000${endpoint}`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'usuario-id': usuarioActivo.usuario_id.toString()
                    },
                    body: JSON.stringify(payload)
                });

                if (!respuesta.ok) throw new Error('Error al generar el documento');

                const blob = await respuesta.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = nombreArchivo;
                document.body.appendChild(a);
                a.click();
                a.remove();
                
                document.getElementById('mensaje-estado').classList.remove('hidden');
                setTimeout(() => document.getElementById('mensaje-estado').classList.add('hidden'), 3000);
                
                cargarHistorial(); 
                
            } catch (error) {
                alert('Hubo un error de conexión.');
                console.error(error);
            } finally {
                btn.innerText = 'Generar Documento Word';
                btn.disabled = false;
            }
        });

        // --- CARGAR HISTORIAL ---
        async function cargarHistorial() {
            const tbody = document.getElementById('tabla-historial');
            try {
                // AÑADIMOS EL HEADER usuario-id
                const respuesta = await fetch('http://127.0.0.1:8000/api/documentos', {
                    headers: {
                        'usuario-id': usuarioActivo.usuario_id.toString()
                    }
                });
                const documentos = await respuesta.json();
                
                tbody.innerHTML = ''; 
                documentos.forEach(doc => {
                    const fila = document.createElement('tr');
                    fila.className = "hover:bg-gray-50 border-b";
                    
                    // Modificamos el botón de descarga para enviar el header mediante fetch
                    fila.innerHTML = `
                        <td class="p-3 font-mono text-xs text-gray-500">#${doc.id}</td>
                        <td class="p-3 font-medium">${doc.cliente}</td>
                        <td class="p-3 font-semibold ${doc.tipo.includes('NDA') ? 'text-purple-600' : 'text-blue-600'}">${doc.tipo}</td>
                        <td class="p-3 text-gray-500">${doc.fecha}</td>
                        <td class="p-3 text-right">
                            <button onclick="descargarDocumento(${doc.id})" class="inline-flex items-center gap-1 text-sm font-semibold text-blue-600 hover:text-blue-800 transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                </svg>
                                Descargar
                            </button>
                        </td>
                    `;
                    tbody.appendChild(fila);
                });
            } catch (error) {
                console.error(error);
            }
        }
        
       // --- DESCARGAR ARCHIVO DESDE HISTORIAL (CON HEADER) ---
        async function descargarDocumento(docId) {
            try {
                const respuesta = await fetch(`http://127.0.0.1:8000/api/documentos/${docId}/descargar`, {
                    headers: { 'usuario-id': usuarioActivo.usuario_id.toString() }
                });
                
                if (!respuesta.ok) throw new Error('No se pudo descargar el archivo');
                
                const contentDisposition = respuesta.headers.get('content-disposition');
                let fileName = `documento_${docId}.docx`;
                if (contentDisposition && contentDisposition.includes('filename=')) {
                    fileName = contentDisposition.split('filename=')[1].replace(/"/g, '');
                }

                const blob = await respuesta.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch(error) {
                alert("Error al descargar el archivo");
            }
        }

        // --- FUNCIÓN DE IA GENERATIVA ---
        async function mejorarConIA(evento) {
            const inputProposito = document.getElementById('nda_proposito');
            const textoBreve = inputProposito.value;
            
            if (!textoBreve) {
                alert("Escribe una idea breve primero (ej: 'fusión con Microsoft') para que la IA la redacte.");
                return;
            }

            const btn = evento.currentTarget;
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = '⏳ Redactando...';
            btn.disabled = true;

            try {
                const respuesta = await fetch('http://127.0.0.1:8000/api/ia/redactar', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'usuario-id': usuarioActivo.usuario_id.toString()
                    },
                    body: JSON.stringify({ texto_breve: textoBreve })
                });

                if (!respuesta.ok) throw new Error('Error al conectar con el motor de IA');
                
                const datos = await respuesta.json();
                inputProposito.value = datos.texto_generado;
                
            } catch (error) {
                alert("Hubo un problema al generar el texto jurídico. Comprueba tu clave de API.");
                console.error(error);
            } finally {
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
